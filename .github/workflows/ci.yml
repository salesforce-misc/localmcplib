name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      LOCALMCP_REQUIRE_BUBBLEWRAP: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 libseccomp2 libc-bin file git curl util-linux
          # The disposable runner must permit the user namespaces under test.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install dependencies
        run: make install
      - name: Run checks
        run: make ci

  seatbelt:
    name: Seatbelt enforcement (macOS)
    runs-on: macos-latest
    env:
      LOCALMCP_REQUIRE_SEATBELT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: make install
      - name: Run checks
        run: make ci
